[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-rl"
version = "0.1.0"
description = "Rede neural em NumPy puro que aprende Snake com Q-learning, com pipeline de dados (Parquet, DuckDB, Streamlit)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eric Guerrize" }]
requires-python = ">=3.11"
keywords = ["reinforcement-learning", "q-learning", "numpy", "snake", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "duckdb>=0.9",
    "typer>=0.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
dashboard = ["streamlit>=1.28"]
pygame = ["pygame>=2.5"]
all = ["snake-rl[dev,dashboard,pygame]"]

[project.scripts]
snake = "snake_rl.cli:app"

[project.urls]
Homepage = "https://github.com/ericguerrize/snake"
Repository = "https://github.com/ericguerrize/snake"

[tool.setuptools.packages.find]
where = ["."]
include = ["snake_rl*"]

[tool.setuptools.package-data]
snake_rl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["snake_rl", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
